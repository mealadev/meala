services:
  postgres:
    image: postgres:16-alpine
    container_name: meala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meala}
      POSTGRES_USER: ${POSTGRES_USER:-meala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    volumes:
      - meala_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meala} -d ${POSTGRES_DB:-meala}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/mealadev/meala-api:${MEALA_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meala-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meala}:${POSTGRES_PASSWORD:-change_me_strong_password}@postgres:5432/${POSTGRES_DB:-meala}
      ORG_API_KEY: ${ORG_API_KEY:-change_me_org_ingestion_key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      RAW_LOGS_DIR: /data/raw_logs
      PARQUET_DIR: /data/parquet_store
      SEED_DEMO_FLIGHTS: ${SEED_DEMO_FLIGHTS:-true}
    volumes:
      - meala_telemetry_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/mealadev/meala-web:${MEALA_VERSION:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: meala-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  meala_pgdata:
  meala_telemetry_data:
